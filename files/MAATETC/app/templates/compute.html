<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ETC Compute</title>
    <link rel="stylesheet" href="{{url_for('static', filename='css/style.css')}}">
    <link rel="stylesheet" href="{{url_for('static', filename='css/bootstrap.min.css')}}">
</head>
<body>
    <section class="">
        <div class="">
            <div class="">
                <form action="" class="formAjax ">
                    <button type="submit" disabled style="display: none;" aria-hidden="true"></button>
                    <div class="">
                        <label for="compute" class="">Compute mode</label>
                        <select name="compute" id="compute" class="inputAjax" >
                            <option value="SN" selected>S/N</option>
                            <option value="texpo">Texpo</option>
                        </select>
                    </div>

                    <div class="">
                        <label for="texpoSN" class="">Requested <span id="computeLabel">SN</span></label>
                        <input class="inputAjax" type="number" id="texpoSN" name="texpoSN">
                    </div>

                    <div class="">
                        <label for="fluxtype">Flux type</label>
                        <select name="fluxtype" id="fluxtype" class="inputAjax" >
                            <option value="continuum" selected>continuum</option>
                            <option value="emline">emline</option>
                        </select>
                    </div>

                    <div class="">
                        <label for="fluxval">Flux value</label>
                        <input class="inputAjax" type="number" id="fluxval" name="fluxval">
                    </div>

                    <div class="form-group">
                        <label for="wvinflux">Reference wavelength</label>
                        <input class="inputAjax" type="text" id="wvinflux" name="wvinflux"> 
                    </div>

                    <!--Completar el select mas adelante -->
                    <div class="">
                        <label for="sedtemplate">SEED templates</label>
                        <select name="sedtemplate" id="sedtemplate" class="inputAjax">
                            <option value="pickles_G0V" selected>pickles_G0V</option>
                            <option value="ones">ones</option>
                            <option value="blackbody 5778">blackbody 5778</option>
                        </select>
                    </div>

                    <div class="">
                        <label for="redz">Red shift</label>
                        <input class="inputAjax" type="number" id="redz" name="redz">
                    </div>

                    <div class="">
                        <label for="moon">Moon</label>
                        <select name="moon" id="moon" class="inputAjax ">
                            <option value="dark" selected>dark</option>
                            <option value="gray">gray</option>
                            <option value="grey">grey</option>
                            <option value="bright">bright</option>
                        </select>
                    </div>

                    <div class="">
                        <label for="airmass">Air mas</label>
                        <input class="inputAjax" type="text" id="airmass" name="airmass">
                    </div>

                    <div class="">
                        <label for="grating">Grating</label>
                        <select name="grating" id="grating" class="inputAjax "> 
                            <option value="R300B" selected>R300B</option> 
                            <option value="R300R">R300R</option> 
                            <option value="R500B">R500B</option> 
                            <option value="R500R">R500R</option> 
                            <option value="R1000B">R1000B</option> 
                            <option value="R1000R">R1000R</option> 
                            <option value="R2000B">R2000B</option> 
                            <option value="R2500U">R2500U</option> 
                            <option value="R2500V">R2500V</option> 
                            <option value="R2500R">R2500R</option> 
                            <option value="R2500I">R2500I</option> 
                        </select>
                    </div>

                    <div class="">
                        <label for="psf">PSF</label>
                        <select name="psf" id="psf" class="inputAjax">
                            <option value="pointsource" selected>pointsource</option>
                            <option value="extended" selected>extended</option>
                        </select>
                    </div>

                    <div class="">
                        <label for="seeing">seeing</label>
                        <input class="inputAjax " type="number" id="seeing" name="seeing" >
                    </div>

                    <div class="" style="display: none;">
                        <label for="area">Area</label>
                        <input class="inputAjax" type="number" id="area" name="area" >
                    </div>

                    <div class="">
                        <label for="breadth">Breadth</label>
                        <input class="inputAjax" type="number" id="breadth" name="breadth" value="0">
                    </div>

                    <div class="">
                        <label for="fwhmA">FwhmA</label>
                        <input class="inputAjax" type="number" id="fwhmA" name="fwhmA">
                    </div>

                    <div class="">
                        <label for="toverhd">toverhd</label>
                        <input class="inputAjax" type="number" id="toverhd" name="toverhd">
                    </div>
                </form>
                <div>
                    <label for="fileUpload" class="">Upload file</label>
                    <input type="file" name="" id="fileUpload" class="">
                    <small></small>
                </div>
                <h1 id="ajaxButton" class="btn btn-primary">Enviar</h1>
                <div class="dropZone" id="dropZone">
                    <h1>Drop the files here to fill in the fields</h1>
                </div>
            </div>
        </div>
        <img  src="" alt="imagen" id="imgGrafica">
        <p id="text"></p>
        <!-- <div class="card w-25 shadow ">
            <div><h1>Aqui estara la grafica</h1></div>
            <div>resumen grafica / posible boton descarga</div>
        </div> -->
    </section>


  
    <script type="module" src="{{url_for('static', filename='js/index.js')}}"></script>
    <script  src="{{url_for('static', filename='js/bootstrap.bundle.min.js')}}"></script>
</body>
</html>
