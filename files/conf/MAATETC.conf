server {
  listen 80;
  listen [::]:80;
  server_name maatetc.iaa.csic.es;

  access_log /var/log/nginx/app.access.log;
  error_log /var/log/nginx/app.error.log;

  # Static assets are served directly by Nginx
  location /static/ {
    alias /var/www/MAATETC/app/static/;
    expires 7d;
  }

  # Everything else goes to Gunicorn through its Unix socket
  location / {
    include proxy_params;
    proxy_pass http://unix:/var/www/MAATETC/app.sock;
  }
}
